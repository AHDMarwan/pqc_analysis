name: Materialize spectral-accessibility suite

on:
  push:
    branches: [spectral-accessibility-pra]
    paths:
      - '.bootstrap/qaccess_core.tgz'
      - '.github/workflows/materialize-spectral-suite.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: spectral-accessibility-pra
      - name: Expand audited source bundle
        run: |
          mkdir -p spectral_accessibility .github/workflows
          tar -xzf .bootstrap/qaccess_core.tgz -C spectral_accessibility
          cp spectral_accessibility/.github/workflows/*.yml .github/workflows/
          rm -rf spectral_accessibility/.github
          rm -f .bootstrap/qaccess_core.tgz .github/workflows/materialize-spectral-suite.yml
          rmdir .bootstrap 2>/dev/null || true
      - name: Commit materialized source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize spectral accessibility PRA suite'
          git push origin HEAD:spectral-accessibility-pra
