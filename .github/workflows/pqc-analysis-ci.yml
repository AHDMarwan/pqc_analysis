name: PQC Analysis CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pqc-analysis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run core tests
        run: python -m pytest tests --ignore=tests/test_qiskit_integration.py

  qiskit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qiskit integration
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,qiskit]"

      - name: Run Qiskit integration tests
        run: python -m pytest tests/test_qiskit_integration.py
