name: Spectral accessibility experiments

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Frozen experiment profile
        required: true
        type: choice
        default: reproduce
        options:
          - reproduce
          - pra_core
          - pra_depth
          - pra_spectrum
          - pra_robustness
          - pra_convergence

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    defaults:
      run:
        working-directory: spectral_accessibility
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: spectral_accessibility/requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - id: plan
        shell: bash
        run: |
          MATRIX="$(qaccess plan --profile '${{ inputs.profile }}' --github-matrix)"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$MATRIX" > plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: qaccess-plan-${{ inputs.profile }}
          path: spectral_accessibility/plan.json
          retention-days: 90

  simulate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: spectral_accessibility
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: spectral_accessibility/requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - name: Run fixed-circuit shard
        run: |
          qaccess run-task \
            --profile '${{ matrix.profile }}' \
            --family '${{ matrix.family }}' \
            --n '${{ matrix.n }}' \
            --depth-factor '${{ matrix.depth_factor }}' \
            --instance-start '${{ matrix.instance_start }}' \
            --instance-stop '${{ matrix.instance_stop }}' \
            --tangents '${{ matrix.tangents }}' \
            --parameter-distribution '${{ matrix.parameter_distribution }}' \
            --output 'results/${{ matrix.task_id }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qaccess-shard-${{ matrix.task_id }}
          path: spectral_accessibility/results/${{ matrix.task_id }}
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: [plan, simulate]
    if: always() && needs.simulate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: spectral_accessibility
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: spectral_accessibility/requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - uses: actions/download-artifact@v8
        with:
          pattern: qaccess-shard-*
          path: spectral_accessibility/downloaded_shards
          merge-multiple: false
      - run: qaccess controls --output aggregate/controls
      - run: qaccess analyze --input downloaded_shards --output aggregate/final
      - name: Check exact manuscript reproduction
        if: inputs.profile == 'reproduce'
        run: |
          qaccess check-reproduction \
            --observed aggregate/final/reproduction_table.csv \
            --reference reference/reported_table_I.csv \
            --output aggregate/final/reproduction_check.csv --strict
      - uses: actions/upload-artifact@v7
        with:
          name: qaccess-final-${{ inputs.profile }}
          path: |
            spectral_accessibility/aggregate
            spectral_accessibility/plan.json
          retention-days: 90
          if-no-files-found: error
